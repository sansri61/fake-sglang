# Prefill, decode and aggregated workers serving one model.
#
# Dynamo keeps aggregated workers in their own worker set next to the
# prefill->decode set and splits requests between the sets, so the two agg
# workers here take traffic as a group rather than joining the decode pool.
#
#   ./launch/cluster.sh launch/clusters/mixed.yaml

frontend:
  router_mode: kv

topology:
  levels: [rack, node]
  links:
    node:    {bandwidth_gb_s: 450, latency_ms: 0.01}
    rack:    {bandwidth_gb_s: 50,  latency_ms: 0.05}
    default: {bandwidth_gb_s: 12.5, latency_ms: 0.5}

workers:
  - {role: prefill, count: 2, location: rack-1/node-1}
  - {role: decode,  count: 2, location: rack-1/node-2}
  - {role: decode,  count: 1, location: rack-2/node-1, args: [--fake-itl-ms, 12]}
  - {role: agg,     count: 2, location: rack-2/node-2}
